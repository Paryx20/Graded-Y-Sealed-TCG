<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      location.replace('https://' + location.host + location.pathname + location.search + location.hash);
    }
  </script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Panel de inventario</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] antialiased min-h-screen flex flex-col">

  <a href="pages/admin.html#admin-main" class="skip-link">Saltar al contenido principal</a>

  <header class="bg-[#0F172A] text-white border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <img src="assets/img/logo/logo.png" alt="" width="30" height="38" class="h-8 w-auto rounded bg-white/95 p-0.5" />
        <span class="text-sm font-semibold">Panel de inventario</span>
      </div>
      <button type="button" id="admin-logout" class="hidden inline-flex items-center gap-1.5 text-sm font-medium text-slate-200 hover:text-white px-3 py-1.5 rounded-md border border-slate-600 hover:border-slate-400">
        <i data-lucide="log-out" class="w-4 h-4" aria-hidden="true"></i>
        Cerrar sesión
      </button>
    </div>
  </header>

  <main id="admin-main" tabindex="-1" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <section id="admin-login" aria-labelledby="admin-login-title" class="max-w-sm mx-auto bg-white border border-slate-200 rounded-lg p-6 shadow-sm">
      <h1 id="admin-login-title" class="text-lg font-semibold mb-1">Iniciar sesión</h1>
      <p class="text-sm text-slate-600 mb-5">Acceso restringido.</p>
      <form id="admin-login-form" novalidate class="space-y-4">
        <div>
          <label for="admin-email" class="block text-sm font-medium mb-1">Correo</label>
          <input id="admin-email" name="email" type="email" autocomplete="username" required
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-[#0F172A]" />
        </div>
        <div>
          <label for="admin-password" class="block text-sm font-medium mb-1">Contraseña</label>
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-[#0F172A]" />
        </div>
        <p id="admin-login-error" role="alert" aria-live="assertive" class="text-sm text-[#BE123C] min-h-[1.25rem]"></p>
        <button type="submit" id="admin-login-submit"
          class="w-full bg-[#0F172A] hover:bg-[#1E293B] text-white text-sm font-semibold rounded-md px-4 py-2.5 disabled:opacity-60">
          Entrar
        </button>
      </form>
    </section>

    <section id="admin-panel" aria-labelledby="admin-panel-title" class="hidden">
      <div class="flex flex-wrap items-end justify-between gap-4 mb-5">
        <div>
          <h1 id="admin-panel-title" tabindex="-1" class="text-xl font-semibold">Inventario</h1>
          <p id="admin-summary" class="text-sm text-slate-600"></p>
        </div>
        <div class="flex flex-wrap items-end gap-3">
          <div>
            <label for="admin-search" class="block text-xs font-medium text-slate-600 mb-1">Buscar</label>
            <input id="admin-search" type="search" placeholder="Nombre o SKU"
              class="w-56 rounded-md border border-slate-300 px-3 py-2 text-sm" />
          </div>
          <div>
            <label for="admin-category" class="block text-xs font-medium text-slate-600 mb-1">Categoría</label>
            <select id="admin-category" class="rounded-md border border-slate-300 px-3 py-2 text-sm bg-white">
              <option value="all">Todas</option>
              <option value="psa">Slabs PSA</option>
              <option value="raw">Raw</option>
              <option value="sealed">Sellado</option>
            </select>
          </div>
          <label class="inline-flex items-center gap-2 text-sm py-2 cursor-pointer">
            <input id="admin-low-stock" type="checkbox" class="w-4 h-4 accent-[#0F172A]" />
            Solo stock bajo (≤ 1)
          </label>
        </div>
      </div>

      <p id="admin-status" role="status" aria-live="polite" class="text-sm min-h-[1.25rem] mb-3"></p>

      <div class="bg-white border border-slate-200 rounded-lg overflow-x-auto">
        <table class="w-full text-sm">
          <caption class="sr-only">Productos del inventario con precio y stock por grado</caption>
          <thead class="bg-slate-50 text-left text-xs font-semibold text-slate-600 border-b border-slate-200">
            <tr>
              <th scope="col" class="px-3 py-2.5">Producto</th>
              <th scope="col" class="px-3 py-2.5">Precio y stock por grado</th>
              <th scope="col" class="px-3 py-2.5">Visible</th>
              <th scope="col" class="px-3 py-2.5"><span class="sr-only">Acciones</span></th>
            </tr>
          </thead>
          <tbody id="admin-rows" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/db/supabase-config.js"></script>
  <script src="js/db/supabase-api.js"></script>
  <script src="js/views/admin.js"></script>
</body>
</html>
